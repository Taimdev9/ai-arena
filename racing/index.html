<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI Racing</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="app">
  <header>
    <h1>🏎️ AI Racing</h1>
    <p class="sub">جرّب السيارة يدوياً</p>
  </header>
  <div class="stats">
    <div class="stat"><span id="speed">0</span><small>السرعة</small></div>
    <div class="stat"><span id="lap">0</span><small>اللفات</small></div>
    <div class="stat"><span id="time">0.0s</span><small>الوقت</small></div>
    <div class="stat"><span id="offtrack">0%</span><small>خارج المسار</small></div>
  </div>

  <canvas id="game" width="700" height="500"></canvas>

  <div class="controls">
    <div class="side">
      <button id="btnLeft" class="circle-btn">◀</button>
      <button id="btnRight" class="circle-btn">▶</button>
    </div>
    <div class="side">
      <button id="btnBrake" class="round-btn brake">BRAKE</button>
      <button id="btnGo" class="round-btn go">GO</button>
    </div>
  </div>

  <p id="status">اضغط GO لتشغيل السيارة</p>
</div>
<script src="track.js?v=3"></script>
<script src="game.js?v=3"></script>
</body>
</html>
