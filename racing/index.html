<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI Racing — تجربة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>🏎️ AI Racing</h1>
    <p class="sub">جرّب السيارة يدوياً — بعدها نضيف AI</p>
  </header>
  <div class="stats">
    <div class="stat"><span id="speed">0</span><small>السرعة</small></div>
    <div class="stat"><span id="lap">0</span><small>اللفات</small></div>
    <div class="stat"><span id="time">0.0s</span><small>الوقت</small></div>
    <div class="stat"><span id="offtrack">0%</span><small>خارج المسار</small></div>
  </div>
  <canvas id="game" width="700" height="500"></canvas>
  <div class="controls">
    <button id="btnLeft">◀</button>
    <button id="btnGas">▲ غاز</button>
    <button id="btnBrake">▼ فرملة</button>
    <button id="btnRight">▶</button>
  </div>
  <p id="status">استخدم الأزرار للقيادة</p>
</div>
<script src="track.js"></script>
<script src="game.js"></script>
</body>
</html>
