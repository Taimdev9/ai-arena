<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI Racing</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div class="app">
  <header>
    <h1>🏎️ AI Racing</h1>
    <p class="sub">علّم AI يقود — وتنافسه</p>
  </header>

  <div class="stats">
    <div class="stat"><span id="speed">0</span><small>السرعة</small></div>
    <div class="stat"><span id="lap">0</span><small>اللفات</small></div>
    <div class="stat"><span id="time">0.0s</span><small>الوقت</small></div>
    <div class="stat"><span id="offtrack">0%</span><small>خارج المسار</small></div>
  </div>

  <canvas id="game" width="700" height="500"></canvas>

  <!-- الأوضاع -->
  <div class="modes">
    <button id="btnManual" class="mode">🎮 يدوي</button>
    <button id="btnRace" class="mode">⚔️ سباق</button>
    <button id="btnTrain" class="mode active">🎓 تدريب</button>
  </div>

  <!-- سباق -->
  <div id="raceInfo" class="hidden">
    <p id="raceResult" class="race-info">—</p>
    <button id="raceStartBtn" class="big-btn">🏁 ابدأ السباق</button>
  </div>

  <!-- تدريب -->
  <div id="trainPanel" class="train-panel">
    <div class="tp-row"><span>حلقات:</span><b id="trEpisodes">0</b></div>
    <div class="tp-row"><span>أفضل لفة (خطوات):</span><b id="trBestLap">-</b></div>
    <div class="tp-row"><span>Epsilon:</span><b id="trEpsilon">1.000</b></div>
    <div class="tp-row"><span>آخر مكافأة:</span><b id="trReward">0</b></div>
  </div>

  <div id="speedPanel" class="speed-panel">
    <span class="speed-label">سرعة التدريب:</span>
    <button class="speed-btn active" data-speed="1">1x 👀</button>
    <button class="speed-btn" data-speed="10">10x</button>
    <button class="speed-btn" data-speed="50">50x ⚡</button>
  </div>

  <div class="row-btns">
    <button id="btnTrainToggle" class="big-btn">▶️ ابدأ التدريب</button>
    <button id="btnResetBrain" class="small-btn">🗑️</button>
  </div>

  <!-- مخطط التطور -->
  <canvas id="chart" width="600" height="110"></canvas>

  <!-- عرض الحساسات -->
  <label class="toggle">
    <input type="checkbox" id="showSensors" checked>
    <span>عرض الحساسات</span>
  </label>

  <!-- تحكم يدوي -->
  <div id="controls" class="controls hidden">
    <div class="side">
      <button id="btnLeft" class="circle-btn">◀</button>
      <button id="btnRight" class="circle-btn">▶</button>
    </div>
    <div class="side">
      <button id="btnBrake" class="round-btn brake">BRAKE</button>
      <button id="btnGo" class="round-btn go">GO</button>
    </div>
  </div>

  <!-- الليدر بورد -->
  <div class="leaderboard">
    <div class="lb-section">
      <h3>🏆 أسرع الأوقات</h3>
      <ol id="fastestList" class="lb-list"></ol>
    </div>
    <div class="lb-section">
      <h3>📝 آخر السباقات</h3>
      <ol id="recentList" class="lb-list"></ol>
    </div>
  </div>

  <p id="status" class="status">جاري التحميل...</p>
</div>
<script src="track.js?v=5"></script>
<script src="ai.js?v=5"></script>
<script src="leaderboard.js?v=5"></script>
<script src="game.js?v=5"></script>
</body>
</html>
