<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Arena — حلبة الذكاء</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1a2a4a, #0a0e1a 70%);
    color: #e6ecff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    max-width: 500px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 42px;
    background: linear-gradient(90deg, #4fc3f7, #b388ff, #ff8a80);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .subtitle {
    color: #8a9bc7;
    margin-bottom: 32px;
    font-size: 14px;
  }
  .games {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .game-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    text-decoration: none;
    color: #e6ecff;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: transform 0.15s, background 0.2s;
  }
  .game-card:hover {
    background: rgba(255,255,255,0.1);
    transform: translateY(-2px);
  }
  .game-card:active { transform: scale(0.98); }
  .icon {
    font-size: 36px;
    flex-shrink: 0;
  }
  .info { text-align: right; flex: 1; }
  .game-card h2 {
    font-size: 20px;
    margin-bottom: 4px;
  }
  .game-card p {
    font-size: 13px;
    color: #8a9bc7;
  }
  .badge {
    font-size: 11px;
    background: #4fc3f7;
    color: #0a0e1a;
    padding: 2px 8px;
    border-radius: 99px;
    font-weight: 700;
  }
  .badge.soon {
    background: #b388ff;
  }
  footer {
    margin-top: 32px;
    font-size: 12px;
    color: #5a6a8f;
  }
</style>
</head>
<body>
<div class="container">
  <h1>AI Arena</h1>
  <p class="subtitle">العاب فيها AI يتعلم — من الصفر</p>

  <div class="games">
    <a href="lab-bot/" class="game-card">
      <div class="icon">🤖</div>
      <div class="info">
        <h2>Lab Bot</h2>
        <p>روبوت يتعلم يوصّل الهدف بمختبر مليان عوائق</p>
      </div>
      <span class="badge">جاهز</span>
    </a>

    <a href="racing/" class="game-card">
      <div class="icon">🏎️</div>
      <div class="info">
        <h2>AI Racing</h2>
        <p>سيارة تتعلم تقود، وتنافس أصدقائك</p>
      </div>
      <span class="badge soon">قريباً</span>
    </a>
  </div>

  <footer>Made with ❤️ + Q-Learning</footer>
</div>
</body>
</html>
